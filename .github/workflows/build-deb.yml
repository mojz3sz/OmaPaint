name: Build Debian package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            os: ubuntu-24.04
          - name: ubuntu-26.04
            os: ubuntu-26.04
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            debhelper \
            dpkg-dev \
            fakeroot \
            qt6-base-dev \
            qt6-declarative-dev \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-dialogs \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-window

      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b

      - name: Verify package and metadata
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t packages < <(find .. -maxdepth 1 -type f -name 'omapaint_*.deb' -print | sort)
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"

          dpkg-deb --field "$package" Package Version Architecture Depends
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package" >/dev/null

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$package" "$GITHUB_WORKSPACE/artifacts/"

      - name: Upload Debian package
        uses: actions/upload-artifact@v6
        with:
          name: omapaint-deb-${{ matrix.name }}
          path: artifacts/*.deb
          if-no-files-found: error
